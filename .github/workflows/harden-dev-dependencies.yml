name: Harden development dependencies

on:
  push:
    branches:
      - security/hardening-4.4.21-valve.4

permissions:
  contents: write

jobs:
  verify:
    name: Update and verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Upgrade vulnerable development tools
        run: npm install --save-dev mocha@^12.0.3 release-it@^21.1.3
      - name: Install from updated lockfile
        run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=high
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Save updated manifests from Node 22
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: hardened-npm-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error

  commit:
    name: Commit verified dependency updates
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/hardening-4.4.21-valve.4
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: hardened-npm-manifests
          path: .
      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes to commit."
          else
            git commit -m "security: update vulnerable development dependencies"
            git push origin HEAD:security/hardening-4.4.21-valve.4
          fi
