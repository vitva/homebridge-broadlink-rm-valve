name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: homebridge-broadlink-rm-valve-${{ github.ref }}-serial
  cancel-in-progress: true

jobs:
  build:
    name: "Build and Test on Node ${{ matrix.node_version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node_version:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v5
      - name: "Use Node.js ${{ matrix.node_version }}"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - name: Refresh safe transitive dependencies
        if: matrix.node_version == 22
        run: |
          npm audit fix --package-lock-only || true
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            branch="security/dependency-fix-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git add package.json package-lock.json
            git commit -m "fix: update vulnerable transitive dependencies"
            git push origin "$branch"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        if: matrix.node_version == 22
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test
