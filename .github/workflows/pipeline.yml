name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebridge-broadlink-rm-valve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and Test on Node ${{ matrix.node_version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - name: "Use Node.js ${{ matrix.node_version }}"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - name: Use consistent npm version
        run: npm install --global npm@10.9.9
      - name: Install dependencies
        run: npm ci
      - name: Install Homebridge 2 HAP test runtime
        run: npm install --no-save --package-lock=false @homebridge/hap-nodejs@2.3.0
      - name: Report full dependency audit
        if: matrix.node_version == 22
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP + "/npm-audit.json"); console.log("Full audit totals:", JSON.stringify(a.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,via:v.via.map(x=>typeof x === "string" ? x : {name:x.name,title:x.title,range:x.range,url:x.url}),effects:v.effects,range:v.range,fixAvailable:v.fixAvailable}));'
      - name: Audit production dependencies
        if: matrix.node_version == 22
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test
      - name: Run real Homebridge 2 bridge startup smoke test
        if: matrix.node_version == 22
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/homebridge-runtime"
          mkdir -p "$runtime_root/storage"
          npm install --prefix "$runtime_root" --no-save --package-lock=false homebridge@^2.0.0 "$GITHUB_WORKSPACE"
          cat > "$runtime_root/storage/config.json" <<'JSON'
          {
            "bridge": {
              "name": "Broadlink Runtime Smoke",
              "username": "CC:22:3D:E3:CE:30",
              "port": 51826,
              "pin": "031-45-154"
            },
            "accessories": [],
            "platforms": [
              {
                "platform": "BroadlinkRM",
                "hideLearnButton": true,
                "hideScanFrequencyButton": true,
                "accessories": []
              }
            ]
          }
          JSON
          set +e
          "$runtime_root/node_modules/.bin/homebridge" \
            -U "$runtime_root/storage" \
            -P "$runtime_root/node_modules" \
            > "$runtime_root/homebridge.log" 2>&1 &
          homebridge_pid=$!
          for attempt in $(seq 1 30); do
            if ! kill -0 "$homebridge_pid" 2>/dev/null; then
              wait "$homebridge_pid"
              status=$?
              cat "$runtime_root/homebridge.log"
              echo "Homebridge exited before completing startup (status $status)."
              exit 1
            fi
            if grep -Fq "No enabled accessories are configured; Broadlink RM platform will remain idle." "$runtime_root/homebridge.log"; then
              break
            fi
            sleep 1
          done
          if ! grep -Fq "No enabled accessories are configured; Broadlink RM platform will remain idle." "$runtime_root/homebridge.log"; then
            kill "$homebridge_pid" 2>/dev/null
            wait "$homebridge_pid" 2>/dev/null
            cat "$runtime_root/homebridge.log"
            echo "Homebridge did not load and initialize the BroadlinkRM platform."
            exit 1
          fi
          kill -INT "$homebridge_pid"
          wait "$homebridge_pid"
          status=$?
          set -e
          cat "$runtime_root/homebridge.log"
          if [ "$status" -ne 0 ]; then
            echo "Homebridge did not shut down cleanly (status $status)."
            exit "$status"
          fi
      - name: Audit release-candidate npm archive
        if: matrix.node_version == 22
        run: bash scripts/audit-release-candidate.sh
