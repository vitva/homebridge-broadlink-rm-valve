name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: homebridge-broadlink-rm-valve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and Test on Node ${{ matrix.node_version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - name: "Use Node.js ${{ matrix.node_version }}"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - name: Synchronize lockfile
        run: npm audit fix --package-lock-only || true
      - name: Commit synchronized lockfile
        if: matrix.node_version == 22
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        if: matrix.node_version == 22
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test
