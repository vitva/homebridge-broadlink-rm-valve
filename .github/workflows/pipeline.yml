name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebridge-broadlink-rm-valve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and Test on Node ${{ matrix.node_version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - name: "Use Node.js ${{ matrix.node_version }}"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - name: Use consistent npm version
        run: npm install --global npm@10.9.9
      - name: Install dependencies
        run: npm ci
      - name: Install Homebridge 2 HAP test runtime
        run: npm install --no-save --package-lock=false @homebridge/hap-nodejs@2.3.0
      - name: Report full dependency audit
        if: matrix.node_version == 22
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log("Full audit totals:", JSON.stringify(a.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,via:v.via.map(x=>typeof x === "string" ? x : {name:x.name,title:x.title,range:x.range,url:x.url}),effects:v.effects,range:v.range,fixAvailable:v.fixAvailable}));'
      - name: Audit production dependencies
        if: matrix.node_version == 22
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test
