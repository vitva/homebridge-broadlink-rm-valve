name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: "Build and Test on Node ${{ matrix.node_version }} and ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - 22
          - 24
          - 26
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Use Node.js ${{ matrix.node_version }}"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test
